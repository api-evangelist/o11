aid: o11
name: O11
description: O11 is a Y Combinator (Winter 2026) startup building custom AI software
  for financial services firms. Rather than forcing teams onto a new external platform,
  O11 embeds AI-driven automation directly into the tools finance teams already use
  every day — Excel, PowerPoint, Word, and other enterprise applications — so users
  can generate presentations, spreadsheets, and documents and automate workflows
  without switching contexts. The company positions itself against the observation
  that a majority of firms still rely on legacy software where generic bolt-on AI
  features fail to deliver real value. As of this profile O11 publishes a marketing
  site (o11.ai) but no public developer API, OpenAPI specification, SDKs, or developer
  documentation could be found; this remains an early-stage identity profile in the
  API Evangelist network awaiting a public API surface.
